# Local helpers. Prefer host processes on Windows (see scripts/dev-all.ps1).
# Runtime owns MediaMTX (host mediamtx.exe). Docker MTX is opt-in:
#   docker compose --profile mtx up -d mediamtx
# Postgres:
#   docker compose up -d postgres
# Do not compose up rabbitmq/kafka on this machine — :5672 / :9092 are already taken.
# Those services are behind profile `mq`:  docker compose --profile mq up -d

services:
  mediamtx:
    profiles: ["mtx"]
    image: bluenviron/mediamtx:1.9.3
    container_name: yolov8-mediamtx
    ports:
      - "8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    volumes:
      - ./backend/data/mediamtx-8554.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    restart: unless-stopped

  # Optional: only when :6379 is free. This machine already has Docker Redis on 6379;
  # the app uses logical DB 2 (REDIS_URL=redis://127.0.0.1:6379/2).
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: yolov8-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  # :5432 is taken (other stacks). This app uses host 5434.
  postgres:
    image: postgres:16-alpine
    container_name: yolov8-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yolov8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-yolov8}
    volumes:
      - yolov8_pg:/var/lib/postgresql/data
    restart: unless-stopped

  # :5672 / :9092 are already in use on this machine — reuse those brokers
  # (RABBITMQ_URL / KAFKA_BOOTSTRAP). Do not `compose up` these unless the ports are free.
  rabbitmq:
    profiles: ["mq"]
    image: rabbitmq:3.13-management-alpine
    container_name: yolov8-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  kafka:
    profiles: ["mq"]
    image: apache/kafka:3.8.1
    container_name: yolov8-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    restart: unless-stopped

  yolo:
    profiles: ["app"]
    build:
      context: ./yolo-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      YOLO_WEIGHTS: /weights/best.pt
      YOLO_DEVICE: cpu
      YOLO_SERVICE_PORT: "8090"
      REDIS_URL: redis://host.docker.internal:6379/2
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - ${YOLO_WEIGHTS_HOST:-./weights}:/weights:ro
    restart: unless-stopped

volumes:
  yolov8_pg:
